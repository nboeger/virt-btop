name: snap

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    outputs:
      snap-file: ${{ steps.snap-name.outputs.snap }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install snapcraft and build dependencies
        run: |
          sudo snap install core22
          sudo snap install snapcraft --classic
          sudo apt-get update -q
          sudo apt-get install -y gcc curl
          echo "/snap/bin" >> "$GITHUB_PATH"

      - name: Verify snap version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          YAML_VER="$(awk '/^version:/{print $2}' snap/snapcraft.yaml | head -1 | tr -d "'\"")"
          if [ "${TAG}" != "${YAML_VER}" ]; then
            echo "::error::snap/snapcraft.yaml version ${YAML_VER} does not match tag ${TAG}; bump it in the same commit as the release"
            exit 1
          fi

      - name: Build snap
        run: snapcraft --destructive-mode

      - name: Record snap file name
        id: snap-name
        run: echo "snap=$(ls *.snap | head -1)" >> "$GITHUB_OUTPUT"

      - name: Verify snap installs and runs
        run: |
          sudo snap install --dangerous "${{ steps.snap-name.outputs.snap }}"
          virt-btop --version

      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: virt-btop-snap
          path: ${{ steps.snap-name.outputs.snap }}

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: virt-btop-snap
          path: virt-btop-snap

      - name: Check store login secret is configured
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "::error::STORE_LOGIN secret is not set. Add it in GitHub → Settings → Secrets and variables → Actions (from 'snapcraft export-login')."
            exit 1
          fi

      - name: Publish snap to store (stable)
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
        with:
          snap: virt-btop-snap/${{ needs.build.outputs.snap-file }}
          release: stable
